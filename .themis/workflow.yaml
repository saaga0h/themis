# Themis's own factory workflow descriptor.
#
# This is how a project tells the stack-agnostic factory how its work flows.
# The themis binary hardcodes none of the below — for themis, "Go" is just what
# this file declares. A node or Julia repo ships its own descriptor instead.
#
# Slice 1 wires `verify` (the Green Gate) and `docs` (authoritative inputs the
# agents read). Later slices add stage toggles and model tiers.

stack: go

# Green Gate: run in order, each must exit 0. The factory runs these via `bash -c`.
# -mod=readonly stops the toolchain rewriting go.sum mid-run (a full-graph go.sum
# rewrite would dirty the tree and trip a checkpoint — observed on issue #101); a
# genuinely missing entry fails loudly instead. It is per-command, so it holds
# regardless of any GOFLAGS, and it does not affect dependency-adding issues —
# build/vet/test only read go.mod, never edit it.
verify:
  - go build -mod=readonly ./...
  - test -z "$(gofmt -l .)"
  - go vet -mod=readonly ./...
  - go test -mod=readonly ./...
  # Per-issue test files are a blocking CODING_STANDARDS rule (name tests by
  # behaviour, not issue number). Enforced here rather than judged by an LLM —
  # backtested clean against recent history before shipping (see docs/development.md
  # "Adding a blocking gate"). Exit 0 when no `<pkg>_issue<N>_test.go` is tracked.
  - '! git ls-files | grep -qE "_issue[0-9]+_test\.go$"'

# Paths a footprint gate always allows, regardless of an issue's declared packages
# — generated/lockfiles a legitimate change touches outside its own packages.
footprint_exempt:
  - go.mod
  - go.sum

# Authoritative inputs the agents read for standards, terminology, architecture.
# Kept lean so reading them fresh each step is cheap.
docs:
  standards: CODING_STANDARDS.md
  glossary: UBIQUITOUS_LANGUAGE.md
  # Documented surfaces: a change touching any of these triggers the Docs step;
  # changes that touch none of them (e.g. templates/, factory/, tooling) skip it.
  surfaces:
    - cmd/themis/
    - internal/
    - README.md
    - ARCHITECTURE.md
    - docs/
